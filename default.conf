server {
    listen 80;
    
    # Root directory for your app
    root /usr/share/nginx/html;
    index index.html;
    
    # Default server name
    server_name _;
    
    # Serve React App (SPA)
    location / {
        try_files $uri /index.html;
    }
    
    # Serve static files with proper caching
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|woff|woff2|ttf|svg|eot)$ {
        expires 1y;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    
    # Deny access to sensitive files
    location ~* \.(env|json|log|git|sql)$ {
        deny all;
    }
    
    # Security headers with CSP
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' ${FONTS_DOMAIN} 'unsafe-inline'; font-src 'self' ${FONTS_STATIC_DOMAIN}; connect-src 'self' ${API_DOMAIN} ${BHUVAN_DOMAIN}/bhuvan/gwc/service/wms ${API_DOMAIN}; media-src 'self' ${API_DOMAIN}; img-src 'self' data:; script-src 'self';" always;
    
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Error handling
    error_page 404 /index.html;
    
    # Logs for debugging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}