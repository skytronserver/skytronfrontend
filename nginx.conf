server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Don't disclose the nginx version on error pages or headers (VAPT)
    server_tokens off;
    # Relative redirects: behind the LB, absolute ones pointed to http://skytron.in:443/...
    absolute_redirect off;

    # Content-Security-Policy (VAPT: unsafe CSP directive). No 'unsafe-inline'
    # or 'unsafe-eval' anywhere: runtime styles (MUI/emotion) carry a per-page
    # nonce, see location = /index.html and src/utils/cspNonce.js.
    # The load balancer must not add its own CSP header on top of this one.
    set $csp_base "default-src 'self'; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.skytron.in https://api.gromed.in https://skytron.in https://gromed.in https://map.gromed.in https://map3.gromed.in https://map2.gromed.in https://server.arcgisonline.com https://map-geocoding.skytron.in https://map.skytron.in https://map2.skytron.in https://skytrack.tech:2000/ https://bhuvan-vec1.nrsc.gov.in/bhuvan/gwc/service/wms https://*.openstreetmap.org/ https://api-tracking.mapwala.in; media-src 'self' blob: https://api.skytron.in https://api.gromed.in https://map.gromed.in https://skytron.in https://map2.gromed.in https://map-geocoding.skytron.in https://map.skytron.in https://map2.skytron.in https://gromed.in; img-src 'self' data: blob: https://api.skytron.in https://api.gromed.in https://skytron.in https://gromed.in https://map-geocoding.skytron.in https://map.skytron.in https://map2.skytron.in https://map.gromed.in https://map2.gromed.in https://map3.gromed.in https://server.arcgisonline.com https://skytrack.tech:2000/ https://bhuvan-vec1.nrsc.gov.in/ https://bhuvan-vec2.nrsc.gov.in/ https://bhuvan-vec3.nrsc.gov.in/ https://bhuvan-ras2.nrsc.gov.in/ https://services.arcgisonline.com https://fonts.gstatic.com/ https://*.openstreetmap.org/; script-src 'self'; object-src 'none'; frame-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    add_header Content-Security-Policy "$csp_base; style-src 'self' https://fonts.googleapis.com" always;

    # The app page: stamp a fresh nonce (nginx's random 128-bit $request_id)
    # into index.html and the CSP header of the same response. Never cached,
    # so the page's nonce always matches its header.
    location = /index.html {
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '__CSP_NONCE__' $request_id;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "$csp_base; style-src 'self' https://fonts.googleapis.com 'nonce-$request_id'" always;
    }

    # Serve templates as real static files (no SPA fallback).
    # Map /templates/<path> -> /usr/share/nginx/html/templates/<path>
    location ~ ^/templates/(.*)$ {
        alias /usr/share/nginx/html/templates/$1;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~ ^/docs/(.*)$ {
        alias /usr/share/nginx/html/docs/$1;
        add_header Cache-Control "public, max-age=3600";
    }

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
