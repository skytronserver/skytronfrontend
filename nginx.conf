server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve templates as real static files (no SPA fallback).
    # Map /templates/<path> -> /usr/share/nginx/html/templates/<path>
    location ~ ^/templates/(.*)$ {
        alias /usr/share/nginx/html/templates/$1;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
