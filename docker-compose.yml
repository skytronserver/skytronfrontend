version: '3.3'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5003:80"
    environment:
      - NODE_ENV=development
      - REACT_APP_BASE_URL=https://api.gromed.in/
      - REACT_APP_BHUVAN_URL=https://bhuvan-vec1.nrsc.gov.in
      # System environment: dev | prod | sos
      - REACT_APP_SYSTEM_ENV=dev
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
