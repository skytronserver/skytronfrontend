<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
    rel="stylesheet">
  <style>
    * {
      font-family: "Times New Roman", Times, serif;
      font-optical-sizing: auto;
      margin: 0;
    }
  </style>
  <!-- Mappls Web Maps SDK -->
  <script src="https://sdk.mappls.com/map/sdk/web?v=3.0&access_token=hbetrqpnyaoqssztkakwzjjmoxkowalvbwus"></script>
  <script>
    // Fallback: Check if Mappls loaded and retry if needed
    window.mapplsLoadAttempts = 0;
    window.checkMapplsLoaded = function () {
      if (typeof window.mappls === 'undefined' && window.mapplsLoadAttempts < 3) {
        window.mapplsLoadAttempts++;
        console.log('Mappls not loaded, retrying... (attempt ' + window.mapplsLoadAttempts + ')');
        setTimeout(window.checkMapplsLoaded, 1000);
      } else if (typeof window.mappls !== 'undefined') {
        console.log('✓ Mappls library loaded successfully');
      }
    };
    setTimeout(window.checkMapplsLoaded, 500);
  </script>
  <title>Mapwala - The Best GPS Trackers Money Can Buy</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>

</html>
